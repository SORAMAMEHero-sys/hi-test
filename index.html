<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆走ランアクション！カスタム版</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            background: #282c34;
            border: 4px solid #61dafb;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="300"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 200, width: 30, height: 30, dy: 0, jumpPower: -12, gravity: 0.6, grounded: true };
    let obstacles = [];
    let gameSpeed = 5; // 初期スピード
    let score = 0;
    let isGameOver = false;

    // 7秒ごとにスピードを1.1倍にする処理
    setInterval(() => {
        if (!isGameOver) {
            gameSpeed *= 1.1;
        }
    }, 7000);

    // 画面全体どこでもジャンプ対応
    window.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        if (isGameOver) {
            resetGame();
        } else if (player.grounded) {
            player.dy = player.jumpPower;
            player.grounded = false;
        }
    });

    function resetGame() {
        obstacles = [];
        score = 0;
        gameSpeed = 5;
        isGameOver = false;
        loop();
    }

    function update() {
        if (isGameOver) return;

        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y > 200) {
            player.y = 200;
            player.dy = 0;
            player.grounded = true;
        }

        if (Math.random() < 0.02) {
            obstacles.push({ x: canvas.width, y: 230, width: 30, height: 30 });
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;

            // 当たり判定
            if (player.x < obstacles[i].x + 20 && player.x + 20 > obstacles[i].x && player.y > 180) {
                isGameOver = true;
            }

            if (obstacles[i].x < -30) {
                obstacles.splice(i, 1);
                score++;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // プレイヤー (🏃‍♂️)
        ctx.font = "30px Arial";
        ctx.fillText("🏃‍♂️", player.x, player.y + 25);

        // 障害物
        for (let obs of obstacles) {
            ctx.fillText("🌵", obs.x, obs.y + 25);
        }

        ctx.fillStyle = "white";
        ctx.fillText("Score: " + score, 20, 30);
        ctx.fillText("Speed: " + gameSpeed.toFixed(1), 20, 60);

        if (isGameOver) {
            ctx.fillStyle = "red";
            ctx.fillText("GAME OVER - タップしてリトライ", 200, 150);
        }
    }

    function loop() {
        update();
        draw();
        if (!isGameOver) requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>

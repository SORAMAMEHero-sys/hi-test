<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆走ランアクション！デバッグ版</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { background: #282c34; border: 4px solid #61dafb; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="300"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 200, width: 30, height: 30, dy: 0, jumpPower: -12, gravity: 0.6, grounded: true };
    let obstacles = [];
    let gameSpeed = 5;
    let score = 0;
    let isGameOver = false;

    window.addEventListener("pointerdown", () => {
        if (isGameOver) {
            obstacles = []; score = 0; gameSpeed = 5; isGameOver = false; loop();
        } else if (player.grounded) {
            player.dy = player.jumpPower; player.grounded = false;
        }
    });

    function update() {
        if (isGameOver) return;
        player.dy += player.gravity; player.y += player.dy;
        if (player.y > 200) { player.y = 200; player.dy = 0; player.grounded = true; }

        if (Math.random() < 0.02) obstacles.push({ x: canvas.width, y: 240 });

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;
            
            // --- 判定をガバガバに広くする(横に長く) ---
            // プレイヤー位置とサボテン位置が重なったらアウト
            if (obstacles[i].x < player.x + 20 && obstacles[i].x > player.x - 20 && player.y > 180) {
                isGameOver = true;
            }

            if (obstacles[i].x < -30) { obstacles.splice(i, 1); score++; }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "30px Arial";
        // プレイヤー描画
        ctx.fillText("🏃‍♂️", player.x, player.y + 25);
        // サボテン描画
        for (let obs of obstacles) ctx.fillText("🌵", obs.x, obs.y);

        // --- 判定エリアを赤枠で表示（デバッグ用） ---
        ctx.strokeStyle = "red";
        ctx.strokeRect(player.x, player.y, 30, 30);
        for (let obs of obstacles) ctx.strokeRect(obs.x, obs.y, 30, 30);

        ctx.fillStyle = "white";
        ctx.fillText("Score: " + score, 20, 30);
        if (isGameOver) ctx.fillText("GAME OVER", 300, 150);
    }

    function loop() {
        update(); draw();
        if (!isGameOver) requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>

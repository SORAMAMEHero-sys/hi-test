<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆走ランアクション！修正版</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { background: #282c34; border: 4px solid #61dafb; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="300"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 200, width: 30, height: 30, dy: 0, jumpPower: -12, gravity: 0.6, grounded: true };
    let obstacles = [];
    let gameSpeed = 5;
    let score = 0;
    let isGameOver = false;
    let speedInterval;

    function startSpeedUp() {
        speedInterval = setInterval(() => { 
            if (!isGameOver) gameSpeed *= 1.1; 
        }, 7000);
    }

    window.addEventListener("pointerdown", (e) => {
        if (isGameOver) {
            obstacles = []; score = 0; gameSpeed = 5; isGameOver = false;
            clearInterval(speedInterval); startSpeedUp(); loop();
        } else if (player.grounded) {
            player.dy = player.jumpPower; 
            player.grounded = false;
        }
    });

    function update() {
        if (isGameOver) return;
        
        // プレイヤーの移動
        player.dy += player.gravity;
        player.y += player.dy;
        if (player.y > 200) { player.y = 200; player.dy = 0; player.grounded = true; }

        // 障害物の生成
        if (Math.random() < 0.02) {
            obstacles.push({ x: canvas.width, y: 240 });
        }

        // 障害物の移動と判定
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;
            
            // --- 厳密な当たり判定 ---
            // キャラクターとサボテンの距離を測る
            let dx = (player.x + 15) - (obstacles[i].x + 15);
            let dy = (player.y + 15) - (obstacles[i].y + 15);
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            // 距離が40以下なら衝突（少し判定を広げた）
            if (distance < 40) { 
                isGameOver = true; 
                clearInterval(speedInterval); 
            }

            if (obstacles[i].x < -30) { obstacles.splice(i, 1); score++; }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // プレイヤーの描画
        ctx.save();
        ctx.translate(player.x + 15, player.y + 15);
        ctx.scale(-1, 1);
        ctx.font = "30px Arial";
        ctx.fillText("🏃‍♂️", -15, 15); 
        ctx.restore();

        // サボテンの描画
        ctx.font = "30px Arial";
        for (let obs of obstacles) {
            ctx.fillText("🌵", obs.x, obs.y);
        }

        // スコア表示
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + score + " | Speed: " + gameSpeed.toFixed(1), 20, 30);
        
        if (isGameOver) {
            ctx.fillStyle = "red";
            ctx.fillText("GAME OVER - タップしてリトライ", 250, 150);
        }
    }

    function loop() {
        update(); 
        draw();
        if (!isGameOver) requestAnimationFrame(loop);
    }

    startSpeedUp(); 
    loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆走ランアクション！右向き強制版</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { background: #282c34; border: 4px solid #61dafb; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="300"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 200, dy: 0, gravity: 0.8, grounded: true };
    let obstacles = [];
    let gameSpeed = 6;
    let score = 0;
    let isGameOver = false;
    let isPressing = false;

    window.addEventListener("pointerdown", () => {
        if (isGameOver) {
            obstacles = []; score = 0; gameSpeed = 6; isGameOver = false; player.y = 200; loop();
        } else if (player.grounded) {
            player.dy = -10;
            player.grounded = false;
            isPressing = true;
        }
    });

    window.addEventListener("pointerup", () => { isPressing = false; });

    function update() {
        if (isGameOver) return;
        if (!isPressing && player.dy < -2) player.dy += 0.5;
        player.dy += player.gravity;
        player.y += player.dy;

        if (player.y > 200) { player.y = 200; player.dy = 0; player.grounded = true; }
        if (Math.random() < 0.02) obstacles.push({ x: canvas.width, y: 220 });

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;
            // 判定エリア（右向きで走るキャラに合わせて調整）
            if (obstacles[i].x < player.x + 30 && obstacles[i].x > player.x - 10 && player.y > 180) {
                isGameOver = true;
            }
            if (obstacles[i].x < -30) { obstacles.splice(i, 1); score++; }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "30px Arial";
        
        // ！！！ここで強制的に右向きにする！！！
        // scaleを(1, 1)にして、鏡合わせを解除した
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // 変換をリセット
        ctx.fillText("🏃‍♂️", player.x, player.y + 30);
        ctx.restore();
        
        for (let obs of obstacles) ctx.fillText("🌵", obs.x, obs.y + 20);

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + score, 20, 30);
        if (isGameOver) ctx.fillText("GAME OVER", 330, 150);
    }

    function loop() {
        update(); draw();
        if (!isGameOver) requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>

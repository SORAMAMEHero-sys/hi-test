<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WARNING</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: monospace;
        text-align: center;
        overflow: hidden;
    }

    #warning {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #050505;
    }

    h1 {
        color: red;
        font-size: 42px;
        animation: blink 0.7s infinite;
    }

    .danger {
        color: #ff3333;
        font-size: 20px;
        margin: 15px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        margin-top: 20px;
        cursor: pointer;
        background: #111;
        color: red;
        border: 2px solid red;
    }

    button:hover {
        background: red;
        color: white;
    }

    #screen {
        display: none;
        min-height: 100vh;
        padding: 30px 15px;
        background: #000;
    }

    #message {
        margin-top: 50px;
        font-size: 20px;
        line-height: 2;
        white-space: pre-line;
    }

    #progress {
        width: 80%;
        max-width: 500px;
        height: 25px;
        border: 2px solid red;
        margin: 30px auto;
    }

    #bar {
        width: 0%;
        height: 100%;
        background: red;
    }

    #download {
        display: none;
        margin-top: 40px;
    }

    #download button {
        font-size: 20px;
    }

    #end {
        display: none;
        color: #00ff66;
        margin-top: 40px;
    }

    @keyframes blink {
        50% {
            opacity: 0.2;
        }
    }
</style>
</head>

<body>

<div id="warning">

    <h1>⚠️ WARNING ⚠️</h1>

    <div class="danger">
        このサイトには刺激の強い演出があります。
    </div>

    <div>
        実際のウイルス感染やファイル削除は発生しません。
    </div>

    <button id="start">覚悟して進む</button>

</div>


<div id="screen">

    <h1>⚠️ SYSTEM WARNING ⚠️</h1>

    <div id="message"></div>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <div id="download">

        <p>
            怪しいファイルが検出されました。
        </p>

        <p>
            <strong>ファイルをダウンロードしますか？</strong>
        </p>

        <button id="downloadButton">
            ダウンロード
        </button>

    </div>

    <div id="end">
        <h2>😏 ダウンロードできませんでした</h2>

        <p>
            ……お疲れさまでした。
        </p>

        <p>
            これは度胸試しでした。
        </p>
    </div>

</div>


<script>

const warning = document.getElementById("warning");
const screen = document.getElementById("screen");
const start = document.getElementById("start");

const message = document.getElementById("message");
const bar = document.getElementById("bar");

const download = document.getElementById("download");
const downloadButton = document.getElementById("downloadButton");

const end = document.getElementById("end");


start.addEventListener("click", function() {

    warning.style.display = "none";
    screen.style.display = "block";

    startSequence();

});


function startSequence() {

    message.textContent =
        "システムを確認しています……";

    setTimeout(function() {

        message.textContent =
            "⚠️ 警告\n\n" +
            "ストレージに異常が検出されました。";

    }, 2000);


    setTimeout(function() {

        message.textContent =
            "HDDを確認しています……";

        startProgress();

    }, 4000);


    setTimeout(function() {

        message.textContent =
            "⚠️ ERROR ⚠️\n\n" +
            "重要なデータが破損している可能性があります。";

    }, 8000);


    setTimeout(function() {

        message.textContent =
            "不明なプログラムを検出しました……";

    }, 11000);


    setTimeout(function() {

        message.textContent =
            "ウイルススキャンを実行しています……";

    }, 14000);


    setTimeout(function() {

        message.textContent =
            "⚠️ 危険なファイルを検出しました。";

        download.style.display = "block";

    }, 18000);

}


function startProgress() {

    let progress = 0;

    const timer = setInterval(function() {

        progress++;

        bar.style.width = progress + "%";

        if (progress >= 100) {

            clearInterval(timer);

        }

    }, 50);

}


downloadButton.addEventListener("click", function() {

    download.style.display = "none";

    message.textContent =
        "ファイルをダウンロードしています……";

    setTimeout(function() {

        message.textContent =
            "❌ ダウンロードに失敗しました。";

        end.style.display = "block";

    }, 2500);

});

</script>

</body>
</html>

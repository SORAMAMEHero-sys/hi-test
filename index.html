<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>爆走ランアクション！完結編</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { background: #282c34; border: 4px solid #61dafb; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="300"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // プレイヤーと障害物の初期位置を完全に合わせる設定
    let player = { x: 50, y: 200, width: 30, height: 30, dy: 0, gravity: 0.6, grounded: true };
    let obstacles = [];
    let gameSpeed = 5;
    let score = 0;
    let isGameOver = false;

    window.addEventListener("pointerdown", () => {
        if (isGameOver) {
            obstacles = []; score = 0; gameSpeed = 5; isGameOver = false; player.y = 200; loop();
        } else if (player.grounded) {
            player.dy = -12; player.grounded = false;
        }
    });

    function update() {
        if (isGameOver) return;
        player.dy += player.gravity; player.y += player.dy;
        if (player.y > 200) { player.y = 200; player.dy = 0; player.grounded = true; }

        if (Math.random() < 0.02) obstacles.push({ x: canvas.width, y: 220 });

        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed;
            
            // --- 判定の完全同期 ---
            // キャラクター(x,y)と障害物(x,y)が近接したらアウト
            if (obstacles[i].x < player.x + 25 && obstacles[i].x > player.x - 20 && player.y > 180) {
                isGameOver = true;
            }

            if (obstacles[i].x < -30) { obstacles.splice(i, 1); score++; }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "30px Arial";
        // プレイヤーの向き修正（scaleで反転）
        ctx.save();
        ctx.translate(player.x + 15, player.y + 15);
        ctx.scale(-1, 1); 
        ctx.fillText("🏃‍♂️", -15, 15);
        ctx.restore();

        // 障害物の描画
        for (let obs of obstacles) ctx.fillText("🌵", obs.x, obs.y);

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + score, 20, 30);
        if (isGameOver) ctx.fillText("GAME OVER", 330, 150);
    }

    function loop() {
        update(); draw();
        if (!isGameOver) requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
